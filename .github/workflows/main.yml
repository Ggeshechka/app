name: 'Tauri Android Build'
on:
  push:
    branches: [ main ]

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Исправляет ошибку Node.js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > ${{ runner.temp }}/keystore.jks

      - name: Build Signed APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TAURI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          # Точный путь только к подписанному файлу
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
